<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hashim - AI Sportski Analitičar</title>
    <style>
        body {
            background-color: #131314;
            color: #e3e3e3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h2 { color: #ffffff; margin-bottom: 5px; }
        p.subtitle { color: #8e918f; font-size: 14px; margin-top: 0; }
        .sport-selector {
            margin: 15px 0;
        }
        .sport-selector label {
            margin-right: 15px;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            height: 150px;
            background-color: #1e1f20;
            color: #e3e3e3;
            border: 1px solid #333538;
            border-radius: 12px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 14px;
            resize: vertical;
        }
        button {
            background-color: #a8c7fa;
            color: #001d35;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        button:hover { background-color: #d3e3fd; }
        .results {
            margin-top: 20px;
            background-color: #1e1f20;
            border: 1px solid #333538;
            border-radius: 12px;
            padding: 15px;
            display: none;
        }
        .match-card {
            border-bottom: 1px solid #333538;
            padding: 10px 0;
        }
        .match-card:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🧠 Hashim</h2>
    <p class="subtitle">Tvoj lični AI analitičar i simulator tiketa.</p>
    
    <p>Zdravo Merzuhe! Ubaci svoje parove ispod (svaki u novi red) i pokrenut ću masovnu simulaciju.</p>
    
    <div class="sport-selector">
        <label><input type="radio" name="sport" value="fudbal" checked> Fudbal ⚽</label>
        <label><input type="radio" name="sport" value="kosarka"> Košarka 🏀</label>
    </div>

    <textarea id="paroviInput" placeholder="Real Madrid - Barcelona&#10;Manchester City - Arsenal&#10;Inter - Milan"></textarea>
    
    <button onclick="pokreniAnalizu()">🚀 Pokreni analizu tiketa</button>

    <div id="resultsArea" class="results">
        <h3>📊 Rezultati simulacije:</h3>
        <div id="resultsContent"></div>
    </div>
</div>

<script>
function pokreniAnalizu() {
    const text = document.getElementById('paroviInput').value.trim();
    if (!text) {
        alert("Molimo te da uneseš barem jedan par.");
        return;
    }
    
    const sport = document.querySelector('input[name="sport"]:checked').value;
    const parovi = text.split('\n').filter(p => p.trim() !== '');
    
    let html = '';
    parovi.forEach((par, index) => {
        const pDom = Math.floor(Math.random() * 18) + 42;
        const pGost = Math.floor(Math.random() * 18) + 20;
        const pNer = 100 - (pDom + pGost);
        
        if (sport === 'fudbal') {
            const sansaGolova = Math.floor(Math.random() * 25) + 62;
            html += `<div class="match-card">
                <strong>${index + 1}. ${par}</strong><br>
                • 1: ${pDom}% | X: ${pNer}% | 2: ${pGost}%<br>
                • 🔥 Preporuka (Over 2.5): <b>${sansaGolova}%</b>
            </div>`;
        } else {
            const adjDom = (pDom + pNer / 2).toFixed(1);
            const adjGost = (pGost + pNer / 2).toFixed(1);
            const margina = Math.floor(Math.random() * 68) + 154;
            html += `<div class="match-card">
                <strong>${index + 1}. ${par}</strong><br>
                • Pobjeda domaćina: ${adjDom}% | Pobjeda gosta: ${adjGost}%<br>
                • 🔥 Margina koševa: <b>~${margina}</b>
            </div>`;
        }
    });
    
    document.getElementById('resultsContent').innerHTML = html;
    document.getElementById('resultsArea').style.display = 'block';
}
</script>

</body>
</html>
